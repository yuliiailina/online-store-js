<div class="modal checkout-modal">
  <div class="modal__content checkout-modal__content">
    <button
      class="modal__close-btn checkout-modal__close"
      type="button"
      aria-label="Close checkout"
    ></button>

    <div class="checkout">
      <h2 class="checkout__title">Checkout</h2>
      <div class="checkout__summary">
        <p>
          <span>Products:</span>
          <span data-checkout-price>$ 0</span>
        </p>

        <p>
          <span>Shipping:</span>
          <span data-checkout-shipping>$ 0</span>
        </p>

        <p class="checkout__total">
          <span>Total:</span>
          <span data-checkout-total>$ 0</span>
        </p>
      </div>
      <form class="checkout-form">
        <label class="checkout-form__label">
          Name
          <input
            class="checkout-form__input"
            type="text"
            name="name"
            placeholder="Your name"
            required
          />
        </label>

        <label class="checkout-form__label">
          Email
          <input
            class="checkout-form__input"
            type="email"
            name="email"
            placeholder="example@email.com"
            required
          />
        </label>

        <label class="checkout-form__label">
          Phone
          <input
            class="checkout-form__input"
            type="tel"
            name="phone"
            placeholder="+380..."
            required
          />
        </label>

        <button class="checkout-form__btn" type="submit">Confirm order</button>
      </form>
      <div class="checkout-success is-hidden">
        <div class="checkout-success__icon">✓</div>

        <h2 class="checkout-success__title">Order successful!</h2>

        <p class="checkout-success__text">Thank you for your order.</p>

        <p class="checkout-success__order">
          Order number:
          <strong data-order-number></strong>
        </p>

        <button class="checkout-success__btn" type="button">
          Continue shopping
        </button>
      </div>
    </div>
  </div>
</div>
